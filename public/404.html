<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      (function () {
        var base = '/cakes-by-kee'
        var path = location.pathname
        if (path.indexOf(base) === 0) path = path.slice(base.length)
        if (!path) path = '/'
        if (path.charAt(0) !== '/') path = '/' + path
        location.replace(base + '/#' + path + location.search)
      })()
    </script>
  </head>
  <body>
    <p>Redirecting…</p>
  </body>
</html>
